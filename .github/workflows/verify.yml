name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python image tooling
        run: python -m pip install --upgrade pillow

      - name: Check runtime cat action assets
        run: npm run check:assets

      - name: Check runtime review screenshots
        run: npm run review:runtime:check

      - name: Run tests
        run: npm test

      - name: Run browser regression tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Check production bundle budget
        run: npm run check:bundle
